# Cross-arch (linux-x86_64 / linux-aarch64) conda env spec for the
# EXPERIMENT_PLAN.md campaign. Conda layer is intentionally minimal —
# pip pins the actual ML stack so x86 cloud and local ARM stay in sync.
#
# `flightgym` is NOT a pip dependency: it is built from source via
#     cd flightlib && python3 setup.py build_ext --inplace
# (cloud_setup.sh handles this).
#
# Regenerate with:
#     conda env export -n flightmare --no-builds > environment.yml
# but expect to hand-curate the conda deps if the auto-generated list
# leaks arch-specific package names.

name: flightmare
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pip=24.3.1
  - setuptools
  - wheel
  - pip:
      - cloudpickle==3.1.2
      - contourpy==1.1.1
      - cycler==0.12.1
      - filelock==3.16.1
      - fonttools==4.57.0
      - fsspec==2025.3.0
      - gymnasium==1.0.0
      - importlib-metadata==8.5.0
      - importlib-resources==6.4.5
      - jinja2==3.1.6
      - joblib==1.4.2
      - kiwisolver==1.4.7
      - markupsafe==2.1.5
      - matplotlib==3.7.5
      - mpmath==1.3.0
      - networkx==3.1
      - numpy==1.24.4
      - opencv-python==4.13.0.92
      - optuna==4.5.0
      - packaging==26.0
      - pandas==2.0.3
      - pillow==10.4.0
      - protobuf==3.20.3
      - pyparsing==3.1.4
      - python-dateutil==2.9.0.post0
      - pytz==2026.1.post1
      - pyyaml==6.0.3
      - ruamel-yaml==0.18.16
      - ruamel-yaml-clib==0.2.8
      - scikit-learn==1.3.2
      - scipy==1.10.1
      - six==1.17.0
      - stable-baselines3==2.4.1
      - sympy==1.13.3
      - tensorboard==2.14.0
      - tensorboard-data-server==0.7.2
      - threadpoolctl==3.5.0
      - torch==2.4.1
      - tqdm==4.67.3
      - typing-extensions==4.13.2
      - tzdata==2025.3
