# ─────────────────────────────────────────────────────────────────
# IROS 2021 Gate Racing Configuration — Split-S Track
# Source: Original IROS 2021 paper track files (tracks/SplitS.yaml)
# ─────────────────────────────────────────────────────────────────

quadrotor_env:
   camera: no
   sim_dt: 0.02
   max_t: 30.0       # 30 seconds per episode
   add_camera: yes

quadrotor_dynamics:
  mass: 0.73
  arm_l: 0.17
  motor_omega_min: 150.0
  motor_omega_max: 3000.0
  motor_tau: 0.0001
  thrust_map: [1.3298253500372892e-06, 0.0038360810526746033, -1.7689986848125325]
  kappa: 0.016
  omega_max: [6.0, 6.0, 6.0]

# ─── Start Position ───────────────────────────────────────
start_pos: [17.5, -15., 6.31]

