# ─── RL Reward Config (IROS 2021 Paper Eq. 2-5) ──────────
rl:
  act_coeff: 0.0            # NOT in paper Eq.4 — disabled for faithful replication
  delta_max: 0.5             # per-step progress cap (m); at sim_dt=0.02, ~25 m/s max
  gate_bonus: 5.0            # sparse reward for passing through a gate
  survival_bonus: 0.0        # per-step survival reward
  crash_penalty: -30.0        # penalty for crashing / going OOB
  gate_radius: 3           # radius within which gate is "passed" (meters)
  body_rate_coeff: 0.0005    # −b·‖ω‖² penalty (paper Eq. 4)
  body_rate_anneal_steps: 5000000 # steps to anneal body rate penalty to 0
  gate_width: 3            # w_g for gate collision penalty (meters) — AlphaPilot gates ~1.2m
  safety_coeff: 0.0          # DISABLED until drone can fly reliably
  safety_d_max: 1.5          # d_max for safety reward activation (meters)
  traj_init_threshold: 0.6   # gate-pass rate to switch to Phase 2 init
  traj_init_fraction: 0.5    # fraction of Phase 2 resets from traj buffer
