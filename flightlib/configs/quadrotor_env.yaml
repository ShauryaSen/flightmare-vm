# ─────────────────────────────────────────────────────────────────
# IROS 2021 Gate Racing Configuration — Split-S Track
# Source: Original IROS 2021 paper track files (tracks/SplitS.yaml)
# ─────────────────────────────────────────────────────────────────

quadrotor_env:
  camera: no
  sim_dt: 0.02
  max_t: 30.0        # 30 seconds per episode
  add_camera: yes

quadrotor_dynamics:
  # Paper experiments.tex L44: J = diag(0.003, 0.003, 0.005), κ = 0.01, l = 0.17
  mass: 0.73
  arm_l: 0.17
  inertia: [0.003, 0.003, 0.005]
  motor_omega_min: 150.0
  motor_omega_max: 3000.0
  motor_tau: 0.0001
  thrust_map: [1.3298253500372891e-06, 0.0038360810526746033, 
      -1.7689986848125325]
  kappa: 0.01
  omega_max: [6.0, 6.0, 6.0]

# ─── Start Position ───────────────────────────────────────
# start_pos: [0.0, 0.0, 10.0]

# ─── Gate Course: AlphaPilot Track ─────────────────────────
# Positions are in world frame [x, y, z] (Z=up).
# Rotations use quaternion format [w, x, y, z].
# C++ computes gate normal as R(q) * [1,0,0] and stores the full
# rotation matrix for gate-frame observations.
# gates:
#   - position: [17.251110, 3.631499, 6.306498]       # Gate1
#     rotation_quat: [0.7071270, 0.0, 0.0, -0.7070865]
#   - position: [16.749825, 39.569970, 6.762500]       # Gate2
#     rotation_quat: [0.9238791, 0.0, 0.0, -0.3826845]
#   - position: [2.329821, 27.867970, 2.546500]        # Gate3
#     rotation_quat: [0.7071068, 0.0, 0.0, 0.7071068]
#   - position: [2.199832, 9.001728, 1.993750]          # Gate4
#     rotation_quat: [0.7071068, 0.0, 0.0, 0.7071068]
#   - position: [-7.308671, -12.136780, 3.229941]       # Gate5
#     rotation_quat: [0.7071068, 0.0, 0.0, 0.7071068]
#   - position: [-7.610180, -28.472035, 2.642500]       # Gate6
#     rotation_quat: [-0.3826836, 0.0, 0.0, -0.9238794]
#   - position: [-0.009001, -33.913000, 2.103112]       # Gate7
#     rotation_quat: [-0.0000263, 0.0, 0.0, -1.0000000]
#   - position: [5.867821, -28.440035, 2.567500]        # Gate8
#     rotation_quat: [0.3826835, 0.0, 0.0, -0.9238795]
#   - position: [7.249821, -11.792030, 2.546500]        # Gate9
#     rotation_quat: [0.7071068, 0.0, 0.0, -0.7071068]
#   - position: [-10.228670, 7.773226, 2.019941]        # Gate10
#     rotation_quat: [0.7071270, 0.0, 0.0, -0.7070865]
#   - position: [-10.048670, 30.623225, 2.897941]       # Gate11
#     rotation_quat: [0.7071323, 0.0, 0.0, -0.7070812]

# gates:
# - position: [8.0, 0.0, 10.0]
#   rotation: [0.0, 0.0, 0.0]
# # G1: 8m along heading 15° from G0, gate yaw = 15°
# - position: [15.727, 2.071, 10.0]
#   rotation: [15.0, 0.0, 0.0]
# # G2: 8m along heading 30° from G1, gate yaw = 30°
# - position: [22.656, 6.071, 10.0]
#   rotation: [30.0, 0.0, 0.0]

start_pos: [0.0, 0.0, 5.0]

gates:
# theta = 0°  → tangent +y
- position: [6.0, 0.0, 5.0]
  rotation: [0.0, 0.0, 0.0]
- position: [12.0, 0.0, 5.0]
  rotation: [0.0, 0.0, 0.0]
- position: [18.0, 0.0, 5.0]
  rotation: [0.0, 0.0, 0.0]
- position: [24.0, 0.0, 5.0]
  rotation: [0.0, 0.0, 0.0]
- position: [30.0, 0.0, 5.0]
  rotation: [0.0, 0.0, 0.0]
- position: [36.0, 0.0, 5.0]
  rotation: [0.0, 0.0, 0.0]
- position: [42.0, 0.0, 5.0]
  rotation: [0.0, 0.0, 0.0]
- position: [48.0, 0.0, 5.0]
  rotation: [0.0, 0.0, 0.0]
rl:
  act_coeff: 0.0             # NOT in paper Eq.4 — kept at 0 for faithfulness
  gate_bonus: 0.0            # PAPER-STRICT (reverted from 10.0 figure_8 carry-over for HP sweep on circle_8). Restore to 10.0 only when fine-tuning figure_8.
  survival_bonus: 0.0        # NOT in paper Eq.4 — kept at 0 for faithfulness
  crash_penalty: 0.0         # NOT in paper Eq.4 — only r_T (gate collision) terminates with reward
  body_rate_coeff: 0.0005    # b·‖ω‖² penalty (paper Eq. 4)
  body_rate_anneal_steps: 5000000  # steps to anneal b → 0 (paper L140: "added at an initial training stage")
  gate_width: 5            # w_g — increased for easier learning (was 3)
  safety_coeff: 0.0          # a in paper Eq. 4 — disabled until base policy works
  safety_d_max: 1.5          # d_max for safety reward activation (meters)
  distributed_init: false   # reverted after v12 failed (Phase 2 didn't engage at random spawns, killed start_pos behavior). Always reset to start_pos.
  traj_init_threshold: 0.6   # mean gates/episode required to switch to Phase 2 (NOT a probability)
  traj_init_fraction: 0.5    # fraction of Phase 2 resets from traj buffer
  traj_init_min_episodes: 200  # per-env episode floor before Phase 2 is considered
  spline_deviation_ratio: 0.5  # progress penalty per meter of lateral deviation from spline
  deviation_penalty_coeff: 0.0   # per-step linear penalty for dev > gate_width/2 (disabled)
