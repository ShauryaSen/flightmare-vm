# Track: Bent-3 (15° per gate)
# Rung 3. Three gates with a 15° heading change at each gate. Each gate's
# yaw matches the direction of the segment entering it, so the spline tangent
# is aligned with the gate normal.
# Heading sequence: 0° → 15° → 30°. Inter-gate spacing 8 m.

description: "Bent-3-15 — 3 gates with 15° bend per gate at z=10m."

start_pos: [0.0, 0.0, 10.0]

gates:
