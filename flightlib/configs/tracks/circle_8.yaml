# Track: Circle-8
# Rung 6. 8 gates evenly spaced on an 18m-radius circle at z=3m, CCW.
# 45° between gates — the gentlest sustained-turning track in the curriculum.
# Gate yaw = 90° + theta (tangent to circle).

description: "Circle-8 — 8 gates on an 18m circle at z=3m. Gentle sustained turn."

start_pos: [18.0, -4.0, 3.0]

gates:
# theta = 0°  → tangent +y
- position: [18.0, 0.0, 3.0]
  rotation: [90.0, 0.0, 0.0]
# theta = 45°
- position: [12.728, 12.728, 3.0]
  rotation: [135.0, 0.0, 0.0]
# theta = 90°
- position: [0.0, 18.0, 3.0]
  rotation: [180.0, 0.0, 0.0]
# theta = 135°
- position: [-12.728, 12.728, 3.0]
  rotation: [225.0, 0.0, 0.0]
# theta = 180°
- position: [-18.0, 0.0, 3.0]
  rotation: [270.0, 0.0, 0.0]
# theta = 225°
- position: [-12.728, -12.728, 3.0]
  rotation: [315.0, 0.0, 0.0]
# theta = 270°
- position: [0.0, -18.0, 3.0]
  rotation: [0.0, 0.0, 0.0]
# theta = 315°
- position: [12.728, -12.728, 3.0]
  rotation: [45.0, 0.0, 0.0]
