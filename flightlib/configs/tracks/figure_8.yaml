# Track: Figure-8
# Rung 12. 8 gates around two tangent 6m-radius circles meeting at the origin.
# Right lobe traversed CW, left lobe traversed CCW — curvature reverses at
# the crossover. The sign-flip in turn rate is the new complication vs. the
# constant-curvature circle/oval/helix tracks.
#
# Drone starts at (0, -4, 3) facing +y. Path:
#   start → G0(top-left of right lobe) → G1(top-right) → G2(bot-right) →
#   G3(bot-left) → cross origin moving +y → G4(top-right of left lobe) →
#   G5(top-left) → G6(bot-left) → G7(bot-right) → back to origin.
#
# Right lobe: center (6,0), CW.  Tangent at angle phi (from center, CCW from +x):
#   T_cw(phi) = (sin(phi), -cos(phi))   →   yaw = atan2(-cos(phi), sin(phi))
# Left lobe:  center (-6,0), CCW. Tangent:
#   T_ccw(phi) = (-sin(phi), cos(phi))  →   yaw = atan2(cos(phi), -sin(phi))

description: "Figure-8 — two 6m-radius lobes, curvature reversal at crossover."

start_pos: [0.0, -4.0, 3.0]

gates:
# Right lobe (CW from origin moving +y).
# phi=135°: pos = (6 + 6*cos(135°), 6*sin(135°)) = (1.757, 4.243). T = (0.707, 0.707), yaw=45°.
- position: [1.757, 4.243, 3.0]
  rotation: [45.0, 0.0, 0.0]
# phi=45°: pos = (10.243, 4.243). T = (0.707, -0.707), yaw=-45° (315°).
- position: [10.243, 4.243, 3.0]
  rotation: [-45.0, 0.0, 0.0]
# phi=315°: pos = (10.243, -4.243). T = (-0.707, -0.707), yaw=-135° (225°).
- position: [10.243, -4.243, 3.0]
  rotation: [-135.0, 0.0, 0.0]
# phi=225°: pos = (1.757, -4.243). T = (-0.707, 0.707), yaw=135°.
- position: [1.757, -4.243, 3.0]
  rotation: [135.0, 0.0, 0.0]
# Left lobe (CCW from origin moving +y).
# phi=45°: pos = (-6 + 6*cos(45°), 6*sin(45°)) = (-1.757, 4.243). T_ccw = (-0.707, 0.707), yaw=135°.
- position: [-1.757, 4.243, 3.0]
  rotation: [135.0, 0.0, 0.0]
# phi=135°: pos = (-10.243, 4.243). T = (-0.707, -0.707), yaw=-135° (225°).
- position: [-10.243, 4.243, 3.0]
  rotation: [-135.0, 0.0, 0.0]
# phi=225°: pos = (-10.243, -4.243). T = (0.707, -0.707), yaw=-45° (315°).
- position: [-10.243, -4.243, 3.0]
  rotation: [-45.0, 0.0, 0.0]
# phi=315°: pos = (-1.757, -4.243). T = (0.707, 0.707), yaw=45°.
- position: [-1.757, -4.243, 3.0]
  rotation: [45.0, 0.0, 0.0]
